syntax = "proto3";

package grpc;

option go_package = "./grpc-gen";

service AuthService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}

message CreateUserRequest {
  string user_id = 1; // UUID
  string username = 2;
  string name = 3;
  string surname = 4;
  string email = 5;
  string password = 6;
  string description = 7;
  // float64 Latitude = 8;
  // float64 Longitude = 9;
}

message CreateUserResponse {
  bool is_created = 1;
}
