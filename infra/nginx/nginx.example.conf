events {
 worker_connections 512;
}

http {

    upstream auth_service {
        server auth-service:8000;
    }

    upstream swipe_service {
        server swipe-service:8001;
    }

    upstream profile_service {
        server profile-service:8002;
    }


    server {
        listen 80;

        location /auth/ {
            proxy_pass http://auth_service/;
        }

        location /profile/ {
            proxy_pass http://profile_service/;
        }

        location /swipe/ {
            proxy_pass http://swipe_service/;
        }
    }
}
